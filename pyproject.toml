[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catl-quant-research"
version = "0.1.0"
description = "Point-in-time quantitative equity research on CATL and battery-industry peers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare==1.18.94",
  "beautifulsoup4==4.15.0",
  "jinja2==3.1.6",
  "lxml==6.1.2",
  "matplotlib==3.11.1",
  "numpy==2.5.2",
  "openpyxl==3.1.5",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
  "requests==2.34.2",
  "scipy==1.18.1",
  "seaborn==0.13.2",
  "statsmodels==0.15.0",
  "tabulate==0.10.0",
  "yfinance==1.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
catl-quant = "catl_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
